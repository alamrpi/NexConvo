# Local development stack. Production uses Kubernetes (see docs/OPERATIONS.md).
# `docker compose up -d` starts infra only; add `--profile apps` to also run the gateway.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexconvo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nexconvo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexconvo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nexconvo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      # Newer Seq requires a first-run admin password OR an explicit opt-out.
      # Local dev has no auth so the log UI opens directly (Standard 13: not a prod secret).
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"

  # Self-hosted embedding server (BGE-M3, 1024-dim) for the RAG knowledge base — OpenAI-compatible
  # /embeddings API. First start downloads the model weights into the cached volume (a few minutes).
  # CPU build: the default (GPU/CUDA) image is 4.5 GB and unnecessary for local dev; -cpu is 714 MB.
  bge-m3:
    image: michaelf34/infinity:0.0.77-cpu
    command: v2 --model-id BAAI/bge-m3 --port 7997
    ports:
      - "7997:7997"
    volumes:
      - bge_model_cache:/app/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7997/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  # pgAdmin — PostgreSQL GUI (http://localhost:5050). Login: admin@nexconvo.local / admin
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nexconvo.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  # Local transactional-email catcher. The platform-default sender points at smtp 1025;
  # nothing leaves the machine. View captured mail at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- Application services (run with: docker compose --profile apps up -d) ----
  # All services listen on container port 8080; host ports mirror their launchSettings
  # for familiarity. Config is env-only (Standard 11/13). Each service's DB/Redis/RabbitMQ
  # depends_on is added here as that wiring lands in the service's implementation pass.

  gateway:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: src/gateway/NexConvo.Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Seq__Url: http://seq
      # In-container, Identity is reachable as http://identity:8080 (not localhost) — override
      # both JWT validation authority and the proxy route from the appsettings.Development.json
      # localhost values so token validation and routing both target the right host.
      Jwt__Authority: http://identity:8080
      ReverseProxy__Clusters__identity-cluster__Destinations__primary__Address: http://identity:8080
      ReverseProxy__Clusters__integrations-cluster__Destinations__primary__Address: http://integrations:8080
      ReverseProxy__Clusters__chat-cluster__Destinations__primary__Address: http://chat:8080
      ReverseProxy__Clusters__knowledge-cluster__Destinations__primary__Address: http://knowledge:8080
    ports:
      - "5055:8080"
    depends_on:
      seq:
        condition: service_started
      identity:
        condition: service_started
      chat:
        condition: service_started

  identity:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: src/services/Identity/NexConvo.Identity.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Seq__Url: http://seq
      # Connection string is env-only; the password is interpolated from .env (Standard 13).
      ConnectionStrings__IdentityDb: "Host=postgres;Port=5432;Database=nexconvo_identity;Username=nexconvo_service;Password=${POSTGRES_SERVICE_PASSWORD:-localdev_service_pw}"
      # Privileged connection used ONLY for startup auto-migration (DDL + RLS + GRANT).
      ConnectionStrings__IdentityDbMigrator: "Host=postgres;Port=5432;Database=nexconvo_identity;Username=${POSTGRES_USER:-nexconvo};Password=${POSTGRES_PASSWORD:-localdev_pg_pw}"
      # Redis backs the distributed /me cache (in-network host; overrides the localhost dev value).
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:-localdev_redis_pw}"
      # Issuer = the in-network URL other services use to reach Identity (the discovery doc
      # derives jwks_uri from it). Overrides the localhost value from appsettings.Development.json.
      Jwt__Issuer: http://identity:8080
      # Platform-default email sender → Mailpit (captured at http://localhost:8025).
      Email__Default__Smtp__Host: mailpit
      Email__Default__Smtp__Port: "1025"
      # Shared secret guarding /internal/* (health-alert-recipients) — same value as the
      # notification service's Internal__ApiKey. Env-only (Standard 13).
      Internal__ApiKey: "${INTERNAL_API_KEY:-localdev_internal_key}"
    ports:
      - "5047:8080"
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
      mailpit:
        condition: service_started

  corecrm:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: src/services/CoreCrm/NexConvo.CoreCrm.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Seq__Url: http://seq
      Jwt__Authority: http://identity:8080
      Jwt__Audience: nexconvo-api
    ports:
      - "5081:8080"
    depends_on:
      identity:
        condition: service_started
      seq:
        condition: service_started

  chat:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: src/services/Chat/NexConvo.Chat.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Seq__Url: http://seq
      Jwt__Authority: http://identity:8080
      Jwt__Audience: nexconvo-api
      ConnectionStrings__ChatDb: "Host=postgres;Port=5432;Database=nexconvo_chat;Username=nexconvo_service;Password=${POSTGRES_SERVICE_PASSWORD:-localdev_service_pw}"
      ConnectionStrings__ChatDbMigrator: "Host=postgres;Port=5432;Database=nexconvo_chat;Username=${POSTGRES_USER:-nexconvo};Password=${POSTGRES_PASSWORD:-localdev_pg_pw}"
      ConnectionStrings__RabbitMQ: "amqp://nexconvo:${RABBITMQ_PASSWORD:-localdev_rmq_pw}@rabbitmq:5672"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:-localdev_redis_pw}"
      SecuritySettings__AiMasterKey: "${AI_MASTER_KEY:-nexconvo-local-dev-aes-key-32chars!!}"
    ports:
      - "5132:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_started
      seq:
        condition: service_started

  knowledge:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: src/services/Knowledge/NexConvo.Knowledge.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Seq__Url: http://seq
      Jwt__Authority: http://identity:8080
      Jwt__Audience: nexconvo-api
      ConnectionStrings__KnowledgeDb: "Host=postgres;Port=5432;Database=nexconvo_knowledge;Username=nexconvo_service;Password=${POSTGRES_SERVICE_PASSWORD:-localdev_service_pw}"
      ConnectionStrings__KnowledgeDbMigrator: "Host=postgres;Port=5432;Database=nexconvo_knowledge;Username=${POSTGRES_USER:-nexconvo};Password=${POSTGRES_PASSWORD:-localdev_pg_pw}"
      ConnectionStrings__RabbitMQ: "amqp://nexconvo:${RABBITMQ_PASSWORD:-localdev_rmq_pw}@rabbitmq:5672"
      # Slice 1 embedding providers — BGE-M3 (self-hosted Infinity container) is the default.
      EMBEDDING__PROVIDER: BgeM3
      EMBEDDING__BGEM3__BASEURL: http://bge-m3:7997
    ports:
      - "5019:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_started
      seq:
        condition: service_started
      bge-m3:
        condition: service_started

  voice:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: src/services/Voice/NexConvo.Voice.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Seq__Url: http://seq
      Jwt__Authority: http://identity:8080
      Jwt__Audience: nexconvo-api
    ports:
      - "5022:8080"
    depends_on:
      identity:
        condition: service_started
      seq:
        condition: service_started

  aiassistant:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: src/services/AiAssistant/NexConvo.AiAssistant.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Seq__Url: http://seq
      Jwt__Authority: http://identity:8080
      Jwt__Audience: nexconvo-api
    ports:
      - "5124:8080"
    depends_on:
      identity:
        condition: service_started
      seq:
        condition: service_started

  automation:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: src/services/Automation/NexConvo.Automation.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Seq__Url: http://seq
      Jwt__Authority: http://identity:8080
      Jwt__Audience: nexconvo-api
      ConnectionStrings__AutomationDb: "Host=postgres;Port=5432;Database=nexconvo_automation;Username=nexconvo_service;Password=${POSTGRES_SERVICE_PASSWORD:-localdev_service_pw}"
      ConnectionStrings__AutomationDbMigrator: "Host=postgres;Port=5432;Database=nexconvo_automation;Username=${POSTGRES_USER:-nexconvo};Password=${POSTGRES_PASSWORD:-localdev_pg_pw}"
      ConnectionStrings__RabbitMQ: "amqp://nexconvo:${RABBITMQ_PASSWORD:-localdev_rmq_pw}@rabbitmq:5672"
      HealthSweep__Cron: "0 */6 * * *"
    ports:
      - "5228:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_started
      seq:
        condition: service_started

  integrations:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: src/services/Integrations/NexConvo.Integrations.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Seq__Url: http://seq
      Jwt__Authority: http://identity:8080
      Jwt__Audience: nexconvo-api
      ConnectionStrings__RabbitMQ: "amqp://nexconvo:${RABBITMQ_PASSWORD:-localdev_rmq_pw}@rabbitmq:5672"
      ConnectionStrings__IntegrationsDb: "Host=postgres;Port=5432;Database=nexconvo_integrations;Username=nexconvo_service;Password=${POSTGRES_SERVICE_PASSWORD:-localdev_service_pw}"
      ConnectionStrings__IntegrationsDbMigrator: "Host=postgres;Port=5432;Database=nexconvo_integrations;Username=${POSTGRES_USER:-nexconvo};Password=${POSTGRES_PASSWORD:-localdev_pg_pw}"
      SecuritySettings__AiMasterKey: "${AI_MASTER_KEY:-nexconvo-local-dev-aes-key-32chars!!}"
    ports:
      - "5018:8080"
    depends_on:
      identity:
        condition: service_started
      seq:
        condition: service_started

  notification:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: src/services/Notification/NexConvo.Notification.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Seq__Url: http://seq
      Jwt__Authority: http://identity:8080
      Jwt__Audience: nexconvo-api
      ConnectionStrings__RabbitMQ: "amqp://nexconvo:${RABBITMQ_PASSWORD:-localdev_rmq_pw}@rabbitmq:5672"
      # Identity's internal (non-gateway, shared-secret-guarded) endpoint for owner/admin lookup.
      Identity__BaseUrl: http://identity:8080
      # Same value as Identity's Internal__ApiKey (Standard 13 — env-only shared secret).
      Internal__ApiKey: "${INTERNAL_API_KEY:-localdev_internal_key}"
      # Notification is the sole holder of the alert email-provider secret. Dev → Mailpit.
      Email__Default__Provider: Smtp
      Email__Default__FromAddress: alerts@nexconvo.local
      Email__Default__FromName: NexConvo Alerts
      Email__Default__Smtp__Host: mailpit
      Email__Default__Smtp__Port: "1025"
      Email__Default__Resend__ApiKey: "${NOTIFICATION_RESEND_API_KEY:-}"
    ports:
      - "5233:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_started
      mailpit:
        condition: service_started
      seq:
        condition: service_started

volumes:
  postgres_data:
  bge_model_cache:
